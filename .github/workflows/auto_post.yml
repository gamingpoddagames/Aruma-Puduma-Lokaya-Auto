name: Auto Facebook Content

on:
  workflow_dispatch:

  schedule:
    # 18:30 Sri Lanka time = 13:00 UTC
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # 2. Setup Python
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ==========================================
      # 3. Install Sinhala fonts
      # ==========================================

      - name: Install Sinhala fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core

      # ==========================================
      # 4. Install FFmpeg
      # ==========================================

      - name: Install FFmpeg
        run: |
          sudo apt-get install -y ffmpeg

      # ==========================================
      # 5. Install Python packages
      # ==========================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================
      # 6. Verify environment
      # ==========================================

      - name: Check Python
        run: |
          python --version

      - name: Check FFmpeg
        run: |
          ffmpeg -version

      - name: Check Sinhala fonts
        run: |
          fc-list :lang=si

      # ==========================================
      # 7. Run Facebook automation
      # ==========================================

      - name: Publish Facebook content
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          python main.py

      # ==========================================
      # 8. Save content history
      # ==========================================

      - name: Save content history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/history.json

          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Update content history"
            git push
          fi
