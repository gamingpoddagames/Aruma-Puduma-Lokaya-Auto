name: Auto Facebook Content

on:
  workflow_dispatch:

  schedule:
    # Every day at 6:30 PM Sri Lanka time
    # 6:30 PM SLST = 1:00 PM UTC
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # 2. Python
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ==========================================
      # 3. System packages
      # ==========================================

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fontconfig \
            fonts-noto-core

          fc-cache -f -v

      # ==========================================
      # 4. Find Sinhala fonts
      # ==========================================

      - name: Check Sinhala fonts
        run: |
          echo "Searching for Sinhala fonts..."
          fc-list :lang=si || true

          echo ""
          echo "Searching Noto fonts..."
          find /usr/share/fonts -iname "*sinhala*" -o -iname "*noto*" | head -100

      # ==========================================
      # 5. Python packages
      # ==========================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================
      # 6. Check Python
      # ==========================================

      - name: Check Python
        run: |
          python --version

      # ==========================================
      # 7. Check FFmpeg
      # ==========================================

      - name: Check FFmpeg
        run: |
          ffmpeg -version | head -5

      # ==========================================
      # 8. Publish Facebook content
      # ==========================================

      - name: Publish Facebook content
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          python main.py

      # ==========================================
      # 9. Save history
      # ==========================================

      - name: Save content history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/history.json

          if git diff --cached --quiet; then
            echo "No history changes."
          else
            git commit -m "Update content history"
            git push
          fi
